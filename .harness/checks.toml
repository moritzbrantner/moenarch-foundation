schema_version = 1

[[checks]]
id = "metadata"
command = ["cargo", "metadata", "--format-version", "1", "--no-deps"]
scope = ["Cargo.toml", "Cargo.lock", "crates/**"]
tier = "full"
blocking = true
evidence_classes = ["static"]
protected_properties = ["INV-001"]
source_of_truth = ["issue:#16", "issue:#17", "invariant:INV-001"]
state_class = "deterministic"
timeout_seconds = 300
tools = ["cargo"]
services = []
generated_outputs = ["target/**"]
cost_class = "low"
success_exit_codes = [0]
failure_semantics = "Cargo metadata does not expose the exact selected versions and dependency requirements."
independence_group = "cargo-metadata"

[[checks]]
id = "audio-contracts-manifest"
command = ["python3", "scripts/check_release_plan.py", "--check", "releases/foundation-audio-contracts.toml"]
scope = [".agent-loop.toml", "Cargo.toml", "Cargo.lock", "crates/audio/audio-contracts/Cargo.toml", "releases/foundation-audio-contracts.toml", "scripts/check_release_plan.py", "scripts/publish_release.py"]
tier = "full"
blocking = true
evidence_classes = ["contract"]
protected_properties = ["INV-001", "INV-002"]
source_of_truth = ["issue:#16", "issue:#17", "invariant:INV-002"]
state_class = "deterministic"
timeout_seconds = 300
tools = ["python3", "cargo", "git"]
services = []
generated_outputs = ["target/**"]
cost_class = "low"
success_exit_codes = [0]
failure_semantics = "The audio-contracts manifest, dependency, issue binding, or source/control binding differs from the exact contract."
independence_group = "release-manifest-validator"

[[checks]]
id = "audio-contracts-archive"
command = ["python3", "scripts/check_release_plan.py", "--package-release", "releases/foundation-audio-contracts.toml"]
scope = [".agent-loop.toml", "Cargo.toml", "Cargo.lock", "crates/audio/audio-contracts/**", "releases/foundation-audio-contracts.toml", "scripts/check_release_plan.py"]
tier = "full"
blocking = true
evidence_classes = ["integration"]
protected_properties = ["INV-003"]
source_of_truth = ["issue:#16", "issue:#17", "invariant:INV-003"]
state_class = "deterministic"
timeout_seconds = 1800
tools = ["python3", "cargo", "git"]
services = []
generated_outputs = ["target/**"]
cost_class = "medium"
success_exit_codes = [0]
failure_semantics = "The one selected audio-contracts crate could not be packaged from its locked crates.io-bound closure."
independence_group = "selected-cargo-package"
