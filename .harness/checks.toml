schema_version = 1

[[checks]]
id = "metadata"
command = ["cargo","metadata","--format-version","1","--no-deps"]
scope = ["Cargo.toml","Cargo.lock","crates/**"]
tier = "full"
blocking = true
evidence_classes = ["static"]
protected_properties = ["INV-001","INV-002"]
source_of_truth = ["issue:#110", "issue:#106", "invariant:INV-001", "repo:.github/workflows/workspace-ci.yml"]
state_class = "deterministic"
timeout_seconds = 300
tools = ["cargo"]
services = []
generated_outputs = ["target/**"]
cost_class = "low"
success_exit_codes = [0]
failure_semantics = "Metadata cannot resolve exactly the reviewed workspace."
independence_group = "metadata-validator"

[[checks]]
id = "validator-tests"
command = ["python3","-m","unittest","discover","-s","scripts","-p","test_*.py"]
scope = ["scripts/**","docs/repository-split/**","Cargo.toml","Cargo.lock"]
tier = "full"
blocking = true
evidence_classes = ["behavioral"]
protected_properties = ["INV-002","INV-003"]
source_of_truth = ["issue:#110", "issue:#106", "invariant:INV-002"]
state_class = "deterministic"
timeout_seconds = 3600
tools = ["python3", "cargo"]
services = []
generated_outputs = ["target/**"]
cost_class = "high"
success_exit_codes = [0]
failure_semantics = "Focused controlled-fault validator tests failed."
independence_group = "validator-sensitivity"
sensitivity = [{ property = "INV-002", status = "proven", method = "controlled-fault", reference = "repo:scripts/test_check_repository_boundaries.py" }, { property = "INV-003", status = "proven", method = "controlled-fault", reference = "repo:scripts/test_check_release_plan.py" }]

