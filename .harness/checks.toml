schema_version = 1

[[checks]]
id = "metadata"
command = ["cargo", "metadata", "--format-version", "1", "--no-deps"]
scope = ["Cargo.toml", "Cargo.lock", "crates/**"]
tier = "full"
blocking = true
evidence_classes = ["static"]
protected_properties = ["INV-001"]
source_of_truth = ["issue:#12", "issue:#13", "invariant:INV-001"]
state_class = "deterministic"
timeout_seconds = 300
tools = ["cargo"]
services = []
generated_outputs = ["target/**"]
cost_class = "low"
success_exit_codes = [0]
failure_semantics = "Cargo metadata does not expose the exact selected versions and dependency requirements."
independence_group = "cargo-metadata"

[[checks]]
id = "wave-2-manifest"
command = ["python3", "scripts/check_release_plan.py", "--check", "releases/foundation-wave-2.toml"]
scope = [".agent-loop.toml", "Cargo.toml", "Cargo.lock", "crates/**/Cargo.toml", "releases/foundation-wave-2.toml", "scripts/check_release_plan.py", "scripts/publish_release.py"]
tier = "full"
blocking = true
evidence_classes = ["contract"]
protected_properties = ["INV-001", "INV-002"]
source_of_truth = ["issue:#12", "issue:#13", "invariant:INV-002"]
state_class = "deterministic"
timeout_seconds = 300
tools = ["python3", "cargo", "git"]
services = []
generated_outputs = ["target/**"]
cost_class = "low"
success_exit_codes = [0]
failure_semantics = "The wave 2 manifest, dependency order, issue binding, or source/control binding differs from the exact contract."
independence_group = "release-manifest-validator"

[[checks]]
id = "wave-2-archives"
command = ["python3", "scripts/check_release_plan.py", "--package-release", "releases/foundation-wave-2.toml"]
scope = [".agent-loop.toml", "Cargo.toml", "Cargo.lock", "crates/**", "releases/foundation-wave-2.toml", "scripts/check_release_plan.py"]
tier = "full"
blocking = true
evidence_classes = ["integration"]
protected_properties = ["INV-003"]
source_of_truth = ["issue:#12", "issue:#13", "invariant:INV-003"]
state_class = "deterministic"
timeout_seconds = 1800
tools = ["python3", "cargo", "git"]
services = []
generated_outputs = ["target/**"]
cost_class = "medium"
success_exit_codes = [0]
failure_semantics = "One of the three selected crates could not be packaged from the locked crates.io-bound candidate closure."
independence_group = "selected-cargo-package"
