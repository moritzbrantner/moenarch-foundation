name: Lockfile diagnostic

on:
  push:
    branches: [chore/agent-fast-loop-environment]

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Reconcile lockfile without broad upgrades
        run: cargo fetch
      - name: Show lockfile-only drift
        run: git diff -- Cargo.lock
      - name: Upload reconciled lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconciled-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
