name: Agent patch issue 64

on:
  push:
    branches:
      - feat/64-expanded-math-evidence

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/64-expanded-math-evidence
          fetch-depth: 0

      - name: Refresh authoritative numerical map
        run: python3 scripts/patch_math_evidence_64.py

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Verify integrated analytical math wave
        run: |
          cargo +1.95.0 check -p moenarch-math-probability
          cargo +1.95.0 fmt --all
          cargo +1.95.0 test -p moenarch-math-probability --locked
          cargo +1.95.0 test -p moenarch-math-statistics --locked
          cargo +1.95.0 test -p moenarch-math-linear --locked --all-features
          cargo +1.95.0 test -p moenarch-math-sparse-data --locked
          cargo +1.95.0 clippy -p moenarch-math-probability --all-targets --locked -- -D warnings
          cargo +1.95.0 doc -p moenarch-math-probability --no-deps --locked
          cargo +1.95.0 metadata --format-version 1 --no-deps --locked > /tmp/metadata.json
          python3 scripts/check_repository_boundaries.py --check
          python3 scripts/check_release_plan.py --check docs/repository-split/release-plan.json
          cargo +1.95.0 package -p moenarch-math-statistics --locked --allow-dirty
          cargo +1.95.0 package -p moenarch-math-probability --locked --allow-dirty

      - name: Commit deterministic evidence patch
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/math/math-probability/Cargo.toml crates/math/math-probability/tests/expanded_math_interop.rs docs/specs/analytical-math-expansion.md docs/specs/numerical-contract-map.md
          git commit -m "Prove expanded analytical math interoperability"
          git push origin HEAD:feat/64-expanded-math-evidence
