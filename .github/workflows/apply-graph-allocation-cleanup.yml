name: Apply graph allocation cleanup

on:
  push:
    branches: [perf/graph-adapter-allocation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/graph-adapter-allocation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Remove graph adapter allocations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/data/graph-analysis-core/src/lib.rs')
          text = path.read_text()

          old_neighbors = "adjacency[*index]\n            .iter()\n            .map(|(neighbor, _)| *neighbor)\n            .collect::<Vec<_>>()"
          new_neighbors = "adjacency[*index]\n            .iter()\n            .map(|(neighbor, _)| *neighbor)"
          if text.count(old_neighbors) != 2:
              raise SystemExit(f'expected 2 direct graph neighbor materializations, found {text.count(old_neighbors)}')
          text = text.replace(old_neighbors, new_neighbors)

          old_page_rank = "adjacency[*index]\n                .iter()\n                .map(|(neighbor, _)| *neighbor)\n                .collect::<Vec<_>>()"
          new_page_rank = "adjacency[*index]\n                .iter()\n                .map(|(neighbor, _)| *neighbor)"
          if text.count(old_page_rank) != 1:
              raise SystemExit(f'expected 1 PageRank neighbor materialization, found {text.count(old_page_rank)}')
          text = text.replace(old_page_rank, new_page_rank)

          old_edges = "    let mut edges = graph.edges.clone();\n"
          new_edges = "    let mut edges = graph.edges.iter().collect::<Vec<_>>();\n"
          if text.count(old_edges) != 1:
              raise SystemExit('expected one owned MST edge clone')
          text = text.replace(old_edges, new_edges)

          old_selected = "            selected.push(edge);\n"
          new_selected = "            selected.push((*edge).clone());\n"
          if text.count(old_selected) != 1:
              raise SystemExit('expected one MST selected-edge push')
          path.write_text(text.replace(old_selected, new_selected))
          PY
          cargo fmt --all
      - name: Validate graph package
        run: |
          cargo test -p moenarch-graph-analysis-core
          cargo clippy -p moenarch-graph-analysis-core --all-targets -- -D warnings
          cargo bench -p moenarch-graph-analysis-core --bench graph --no-run
      - name: Commit patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/apply-graph-allocation-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/data/graph-analysis-core/src/lib.rs crates/data/graph-analysis-core/Cargo.toml crates/data/graph-analysis-core/benches/graph.rs Cargo.lock .github/workflows/apply-graph-allocation-cleanup.yml
          git commit -m "perf(graph): remove adapter allocation overhead"
          git push origin HEAD:perf/graph-adapter-allocation
