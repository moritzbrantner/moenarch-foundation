name: refresh-priority-queue-lock

on:
  push:
    branches: [fix/priority-queue-boundary]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/priority-queue-boundary
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Refresh Cargo lockfile from manifests
        run: cargo check -p moenarch-priority-queue
      - name: Commit generated lockfile and remove this one-shot workflow
        run: |
          git diff --check
          git diff --exit-code --quiet -- Cargo.lock && {
            echo "Cargo.lock did not change" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/refresh-priority-queue-lock.yml
          git commit -m "chore: refresh priority queue lockfile"
          git push origin HEAD:fix/priority-queue-boundary
