name: Agent patch issue 60

on:
  push:
    branches:
      - feat/60-probability-distributions

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/60-probability-distributions
          fetch-depth: 0

      - name: Register probability package
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json
          import re

          root = Path(".")
          cargo = root / "Cargo.toml"
          text = cargo.read_text()
          member_marker = '    "crates/math/math-linear-server",\n'
          member = member_marker + '    "crates/math/math-probability",\n'
          if '"crates/math/math-probability"' not in text:
              if text.count(member_marker) != 1:
                  raise SystemExit("expected math-linear-server member marker")
              text = text.replace(member_marker, member, 1)

          dependency_marker = 'math-linear = { package = "moenarch-math-linear", version = "=0.1.1", path = "crates/math/math-linear" }\n'
          dependency = dependency_marker + 'math-probability = { package = "moenarch-math-probability", version = "=0.1.0", path = "crates/math/math-probability" }\n'
          if 'math-probability = {' not in text:
              if text.count(dependency_marker) != 1:
                  raise SystemExit("expected math-linear dependency marker")
              text = text.replace(dependency_marker, dependency, 1)
          cargo.write_text(text)

          ownership_path = root / "docs/repository-split/post-extraction-package-ownership.json"
          ownership = json.loads(ownership_path.read_text())
          if not any(item.get("current_package_name") == "moenarch-math-probability" for item in ownership["packages"]):
              ownership["packages"].append({
                  "automatic_publish_eligible": True,
                  "contract_owner": "moenarch-math-probability",
                  "current_domain": "math",
                  "current_package_name": "moenarch-math-probability",
                  "current_published_version": None,
                  "current_release_workflow": "manual docs/RELEASE_CHECKLIST.md",
                  "ecosystem": "cargo",
                  "extraction_phase": "foundation",
                  "id": "cargo:moenarch-math-probability",
                  "intended_next_release_owner": "moritzbrantner/moenarch-foundation",
                  "intended_package_name": "moenarch-math-probability",
                  "manifest_path": "crates/math/math-probability/Cargo.toml",
                  "migration_status": "foundation-authored",
                  "package_kind": "library",
                  "provenance": {
                      "introduced_after_commit": "348748428f9344883ebe4cd491385209a22a02c1",
                      "issue": "https://github.com/moritzbrantner/moenarch-foundation/issues/60"
                  },
                  "publication_class": "crates.io",
                  "source_version": "0.1.0",
                  "target_repository": "moenarch-foundation",
                  "temporary_boundary_violations": [],
                  "wrapped_library": None
              })
              ownership["packages"].sort(key=lambda item: item["current_package_name"])
              ownership_path.write_text(json.dumps(ownership, indent=2) + "\n")

          release_path = root / "docs/repository-split/post-extraction-release-plan.json"
          release = json.loads(release_path.read_text())
          if not any(item.get("name") == "moenarch-math-probability" for item in release["packages"]):
              release["packages"].append({
                  "expected_tag": None,
                  "manifest_path": "crates/math/math-probability/Cargo.toml",
                  "name": "moenarch-math-probability",
                  "new_version": "0.1.0",
                  "old_version": "0.1.0",
                  "intended_next_release_owner": "moritzbrantner/moenarch-foundation",
                  "publish": False,
                  "release_dependencies": ["moenarch-media-core"]
              })
              release["packages"].sort(key=lambda item: item["name"])
          if "moenarch-math-probability" not in release["dependency_order"]:
              release["dependency_order"].append("moenarch-math-probability")
          release_path.write_text(json.dumps(release, indent=2) + "\n")

          split_path = root / "scripts/repository_split.py"
          split = split_path.read_text()
          old_names = '{"moenarch-corpus-core", "moenarch-math-geometry-3d", "moenarch-priority-queue"}'
          new_names = '{"moenarch-corpus-core", "moenarch-math-geometry-3d", "moenarch-math-probability", "moenarch-priority-queue"}'
          if "moenarch-math-probability" not in split:
              if split.count(old_names) != 1:
                  raise SystemExit("expected post-extraction package-name marker")
              split = split.replace(old_names, new_names, 1)

          base_ownership = json.loads((root / "docs/repository-split/package-ownership.json").read_text())
          merged_records = base_ownership["packages"] + ownership["packages"]
          names = {"moenarch-corpus-core", "moenarch-math-geometry-3d", "moenarch-math-probability", "moenarch-priority-queue"}
          records = sorted(
              [item for item in merged_records if item.get("current_package_name") in names],
              key=lambda item: str(item.get("current_package_name")),
          )
          encoded = json.dumps(records, sort_keys=True, separators=(",", ":")).encode()
          digest = hashlib.sha256(encoded).hexdigest()
          split = re.sub(
              r'POST_EXTRACTION_RECORDS_SHA256 = \(\n    "[0-9a-f]{64}"\n\)',
              f'POST_EXTRACTION_RECORDS_SHA256 = (\n    "{digest}"\n)',
              split,
              count=1,
          )
          split_path.write_text(split)

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Generate lock and verify probability package
        run: |
          cargo +1.95.0 check -p moenarch-math-probability
          cargo +1.95.0 fmt --all
          cargo +1.95.0 test -p moenarch-math-probability --locked
          cargo +1.95.0 clippy -p moenarch-math-probability --all-targets --locked -- -D warnings
          cargo +1.95.0 doc -p moenarch-math-probability --no-deps --locked
          cargo +1.95.0 metadata --format-version 1 --no-deps --locked > /tmp/metadata.json
          python3 scripts/check_repository_boundaries.py --check
          python3 scripts/check_release_plan.py --check docs/repository-split/release-plan.json
          cargo +1.95.0 package -p moenarch-math-probability --locked --allow-dirty

      - name: Commit deterministic patch
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/math/math-probability docs/repository-split/post-extraction-package-ownership.json docs/repository-split/post-extraction-release-plan.json scripts/repository_split.py
          git commit -m "Add deterministic probability distributions"
          git push origin HEAD:feat/60-probability-distributions
