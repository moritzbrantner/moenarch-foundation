# Temporary PR-only runner: reconcile dependency metadata and capture rustfmt.
# This file is removed from the implementation branch after consuming its output.
name: temporary-probability-validation
on:
  pull_request:
    paths:
      - ".github/workflows/temporary-probability-validation.yml"
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Reconcile lock and format, then run the focused tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo fmt --all
          if cargo test --locked -p moenarch-math-probability; then
            echo "FOCUSED_PROBABILITY_TEST:passed"
          else
            echo "FOCUSED_PROBABILITY_TEST:failed"
          fi
          for file in \
            Cargo.lock \
            crates/math/math-probability/src/lib.rs \
            crates/math/math-probability/tests/statrs_parity.rs \
            crates/math/math-probability/tests/expanded_math_interop.rs \
            crates/math/math-probability/benches/cdf_reference.rs; do
            echo "BEGIN_RECONCILED:$file"
            base64 -w 768 "$file"
            echo
            echo "END_RECONCILED:$file"
          done
