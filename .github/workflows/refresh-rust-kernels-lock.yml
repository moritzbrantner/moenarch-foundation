name: Refresh rust-kernels lock

on:
  push:
    branches:
      - deps/rust-kernels-c21b8306

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh rust-kernels lock entries
        run: cargo update -p graph-kernels -p collection-kernels
      - name: Verify locked metadata
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Commit generated lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-rust-kernels-lock.yml
          git add Cargo.lock
          git commit -m "chore: refresh rust-kernels lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
