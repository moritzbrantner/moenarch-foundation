name: Corpus Core Bootstrap

on:
  push:
    branches:
      - feat/corpus-core-contract

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/corpus-core-contract

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
          components: rustfmt, clippy

      - name: Wire workspace and control metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root = Path('.')

          cargo_path = root / 'Cargo.toml'
          cargo = cargo_path.read_text()
          member_anchor = '    "crates/bindings/vector-analysis-index-wasm",\n    "crates/data/data-inversion-core",'
          member_replacement = '    "crates/bindings/vector-analysis-index-wasm",\n    "crates/corpus/corpus-core",\n    "crates/data/data-inversion-core",'
          if '"crates/corpus/corpus-core"' not in cargo:
              if member_anchor not in cargo:
                  raise SystemExit('workspace member anchor not found')
              cargo = cargo.replace(member_anchor, member_replacement, 1)

          dependency_anchor = 'audio-contracts = { package = "moenarch-audio-contracts", version = "=0.1.0", path = "crates/audio/audio-contracts" }\n'
          dependency_line = 'corpus-core = { package = "moenarch-corpus-core", version = "=0.1.0", path = "crates/corpus/corpus-core" }\n'
          if dependency_line not in cargo:
              if dependency_anchor not in cargo:
                  raise SystemExit('workspace dependency anchor not found')
              cargo = cargo.replace(dependency_anchor, dependency_anchor + dependency_line, 1)
          cargo_path.write_text(cargo)

          ownership_path = root / 'docs/repository-split/post-extraction-package-ownership.json'
          ownership = json.loads(ownership_path.read_text())
          corpus_record = {
              'automatic_publish_eligible': True,
              'contract_owner': 'moenarch-corpus-core',
              'current_domain': 'corpus',
              'current_package_name': 'moenarch-corpus-core',
              'current_published_version': None,
              'current_release_workflow': 'manual docs/RELEASE_CHECKLIST.md',
              'ecosystem': 'cargo',
              'extraction_phase': 'foundation',
              'id': 'cargo:moenarch-corpus-core',
              'intended_next_release_owner': 'moritzbrantner/moenarch-foundation',
              'intended_package_name': 'moenarch-corpus-core',
              'manifest_path': 'crates/corpus/corpus-core/Cargo.toml',
              'migration_status': 'foundation-authored',
              'package_kind': 'library',
              'provenance': {
                  'introduced_after_commit': '7a04ac5785bbe74acaba2bb6df5ca2ad52043934',
                  'issue': 'https://github.com/moritzbrantner/moenarch-foundation/issues/55',
              },
              'publication_class': 'crates.io',
              'source_version': '0.1.0',
              'target_repository': 'moenarch-foundation',
              'temporary_boundary_violations': [],
              'wrapped_library': None,
          }
          if not any(p.get('current_package_name') == 'moenarch-corpus-core' for p in ownership['packages']):
              ownership['packages'].append(corpus_record)
          ownership['packages'].sort(key=lambda p: p['current_package_name'])
          ownership_path.write_text(json.dumps(ownership, indent=2) + '\n')

          release_path = root / 'docs/repository-split/post-extraction-release-plan.json'
          release = json.loads(release_path.read_text())
          release_record = {
              'expected_tag': None,
              'manifest_path': 'crates/corpus/corpus-core/Cargo.toml',
              'name': 'moenarch-corpus-core',
              'new_version': '0.1.0',
              'old_version': '0.1.0',
              'intended_next_release_owner': 'moritzbrantner/moenarch-foundation',
              'publish': False,
              'release_dependencies': [],
          }
          if not any(p.get('name') == 'moenarch-corpus-core' for p in release['packages']):
              release['packages'].append(release_record)
          release['packages'].sort(key=lambda p: p['name'])
          release['dependency_order'] = sorted(p['name'] for p in release['packages'])
          release_path.write_text(json.dumps(release, indent=2) + '\n')

          canonical = json.loads((root / 'docs/repository-split/package-ownership.json').read_text())
          combined_records = canonical['packages'] + ownership['packages']
          post_names = {
              'moenarch-corpus-core',
              'moenarch-math-geometry-3d',
              'moenarch-priority-queue',
          }
          post_records = sorted(
              (record for record in combined_records if record.get('current_package_name') in post_names),
              key=lambda record: str(record.get('current_package_name')),
          )
          if {record.get('current_package_name') for record in post_records} != post_names:
              raise SystemExit('post-extraction ownership records incomplete')
          digest = hashlib.sha256(
              json.dumps(post_records, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()

          split_path = root / 'scripts/repository_split.py'
          split = split_path.read_text()
          split, names_count = re.subn(
              r'POST_EXTRACTION_PACKAGE_NAMES = frozenset\(\n    \{.*?\}\n\)',
              'POST_EXTRACTION_PACKAGE_NAMES = frozenset(\n    {"moenarch-corpus-core", "moenarch-math-geometry-3d", "moenarch-priority-queue"}\n)',
              split,
              count=1,
              flags=re.S,
          )
          split, digest_count = re.subn(
              r'POST_EXTRACTION_RECORDS_SHA256 = \(\n    "[0-9a-f]{64}"\n\)',
              f'POST_EXTRACTION_RECORDS_SHA256 = (\n    "{digest}"\n)',
              split,
              count=1,
          )
          if names_count != 1 or digest_count != 1:
              raise SystemExit('post-extraction control constants not updated exactly once')
          split_path.write_text(split)

          boundaries_path = root / 'scripts/check_repository_boundaries.py'
          boundaries = boundaries_path.read_text()
          boundaries = boundaries.replace('if len(records) != 62:', 'if len(records) != 63:')
          boundaries = boundaries.replace('exactly 62 packages', 'exactly 63 packages')
          boundaries = boundaries.replace('62 uniquely owned foundation packages', '63 uniquely owned foundation packages')
          boundaries_path.write_text(boundaries)

          release_check_path = root / 'scripts/check_release_plan.py'
          release_check = release_check_path.read_text()
          release_check = release_check.replace('if len(packages) != 62 or', 'if len(packages) != 63 or')
          release_check = release_check.replace('62 owned packages', '63 owned packages')
          release_check = release_check.replace('62 packages', '63 packages')
          release_check_path.write_text(release_check)

          release_test_path = root / 'scripts/test_check_release_plan.py'
          release_test = release_test_path.read_text().replace('62 owned packages', '63 owned packages')
          release_test_path.write_text(release_test)
          PY

      - name: Refresh lockfile minimally
        shell: bash
        run: |
          cargo check -p moenarch-corpus-core
          changed_lines="$(git diff --numstat -- Cargo.lock | awk '{sum += $1 + $2} END {print sum + 0}')"
          echo "Cargo.lock changed lines: ${changed_lines}"
          test "${changed_lines}" -le 20

      - name: Format and focused verification
        shell: bash
        run: |
          cargo fmt --all
          cargo test --locked -p moenarch-corpus-core
          cargo clippy --locked -p moenarch-corpus-core --all-targets -- -D warnings
          python3 scripts/check_repository_boundaries.py --check
          python3 scripts/check_release_plan.py --check docs/repository-split/release-plan.json
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Fast workspace gate
        shell: bash
        run: bash scripts/check-fast.sh

      - name: Commit generated workspace updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Cargo.toml Cargo.lock \
            crates/corpus/corpus-core \
            docs/specs/corpus-core-contract.md \
            docs/repository-split/post-extraction-package-ownership.json \
            docs/repository-split/post-extraction-release-plan.json \
            scripts/repository_split.py \
            scripts/check_repository_boundaries.py \
            scripts/check_release_plan.py \
            scripts/test_check_release_plan.py
          git diff --cached --check
          git commit -m 'feat(corpus-core): wire foundation contract' || exit 0
          git push origin HEAD:feat/corpus-core-contract
