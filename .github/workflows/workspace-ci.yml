name: workspace-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environment-validation: ${{ steps.scope.outputs.environment-validation }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_EVENT: ${{ toJSON(github.event) }}
        run: |
          import json
          import os
          import re
          import subprocess

          # Preserve GitHub path-filter semantics, including both paths of a rename.
          def matches(path, pattern):
              parts = re.split(r"(\*\*/|\*\*|\*|\?)", pattern)
              expression = "".join({"**/": "(?:.*/)?", "**": ".*", "*": "[^/]*", "?": "[^/]"}.get(part, re.escape(part)) for part in parts)
              return re.fullmatch(expression, path) is not None

          def included(value, patterns):
              selected = False
              for pattern in patterns:
                  negative = pattern.startswith("!")
                  if matches(value, pattern[1:] if negative else pattern):
                      selected = not negative
              return selected

          specs = {'environment-validation': {'paths': ['.repository-environment.toml', 'scripts/codex-environment.sh', 'scripts/check-agent-readiness.sh', 'rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', '.github/workflows/environment-v1.yml']}}
          pr = os.environ["GITHUB_EVENT_NAME"] == "pull_request"
          event = json.loads(os.environ.get("PR_EVENT", "{}"))
          paths = []
          if pr:
              raw = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]])
              paths = [path for path in raw.decode().split("\0") if path]
          docs_only = pr and bool(paths) and all(path.endswith(".md") for path in paths)
          selected = {}
          for job, spec in specs.items():
              active = pr
              if active and spec.get("branches"):
                  active = included(event["pull_request"]["base"]["ref"], spec["branches"])
              if active and spec.get("branches-ignore"):
                  active = not included(event["pull_request"]["base"]["ref"], spec["branches-ignore"])
              if active and paths and spec.get("paths"):
                  active = any(included(path, spec["paths"]) for path in paths)
              if active and paths and spec.get("paths-ignore"):
                  active = any(not included(path, spec["paths-ignore"]) for path in paths)
              # An empty comparison is not evidence that a required validation is out of scope.
              selected[job] = active
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for job, active in selected.items():
                  print(f"{job}={str(active).lower()}", file=output)
              skipped = [job for job, active in selected.items() if not active]
              if docs_only:
                  skipped.extend(["verify","wasm-bindings","performance-smoke"])
              print("allow-skipped=" + json.dumps(skipped), file=output)
              print("docs-only=" + str(docs_only).lower(), file=output)

  verify:
    needs: validation-scope
    if: needs.validation-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Ownership and release validators
        run: |
          cargo metadata --locked --format-version 1 --no-deps
          python3 scripts/check_repository_boundaries.py --check
          python3 scripts/check_release_plan.py --check docs/repository-split/release-plan.json
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --locked --workspace --all-features
      - name: Test no default features
        run: cargo test --locked --workspace --no-default-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
      - name: Package all crates without publishing
        run: python3 scripts/check_release_plan.py --package-all docs/repository-split/release-plan.json
      - name: Test independently extracted numerical archives
        run: python3 scripts/check_numerical_package_tests.py

      - name: Diagnose exact environment after verification failure
        if: ${{ failure() }}
        continue-on-error: true
        uses: moritzbrantner/coding-tooling@81da4fbbdbe75a8937716cbab0b9a47c447269e8
        with:
          operation: environment-verify
          report-path: .artifacts/environment/verify.json
          install-mode: none

  wasm-bindings:
    needs: validation-scope
    if: needs.validation-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check every WASM binding crate on its deployment target
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(
            cargo metadata --locked --no-deps --format-version 1 |
              python3 -c 'import json, sys; data = json.load(sys.stdin); print("\n".join(p["name"] for p in data["packages"] if "/crates/bindings/" in p["manifest_path"].replace("\\", "/")))'
          )

          if ((${#packages[@]} == 0)); then
            echo "::error::No crates under crates/bindings were discovered by cargo metadata"
            exit 1
          fi

          printf 'Discovered %d WASM binding crates:\n' "${#packages[@]}"
          printf '  %s\n' "${packages[@]}"

          for package in "${packages[@]}"; do
            cargo check --locked --target wasm32-unknown-unknown --all-features -p "$package"
          done

      - name: Diagnose exact environment after WASM verification failure
        if: ${{ failure() }}
        continue-on-error: true
        uses: moritzbrantner/coding-tooling@81da4fbbdbe75a8937716cbab0b9a47c447269e8
        with:
          operation: environment-verify
          report-path: .artifacts/environment/wasm.json
          install-mode: none

  performance-smoke:
    needs: validation-scope
    if: needs.validation-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.99.1"
      - name: Compile full benchmark matrix
        run: |
          mkdir -p .artifacts/performance-smoke
          cargo bench --locked --workspace --all-features --no-run 2>&1 \
            | tee .artifacts/performance-smoke/benchmark-compile.log
      - name: Install Callgrind
        run: |
          sudo apt-get \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- \
            update
          sudo apt-get \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- \
            install --yes valgrind
      - name: Install Iai-Callgrind runner
        run: cargo install iai-callgrind-runner --version 0.16.1 --locked
      - name: Run deterministic performance smoke
        env:
          PERF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: bash scripts/benchmark-smoke.sh
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-smoke-${{ github.sha }}
          path: .artifacts/performance-smoke/
          if-no-files-found: warn

      - name: Diagnose exact environment after performance-smoke failure
        if: ${{ failure() }}
        continue-on-error: true
        uses: moritzbrantner/coding-tooling@81da4fbbdbe75a8937716cbab0b9a47c447269e8
        with:
          operation: environment-verify
          report-path: .artifacts/environment/performance.json
          install-mode: none

  environment-validation:
    needs: validation-scope
    if: needs.validation-scope.outputs.environment-validation == 'true'
    uses: ./.github/workflows/environment-v1.yml
    secrets: inherit
    permissions:
      contents: read

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["verify", "wasm-bindings", "performance-smoke", "validation-scope", "environment-validation"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["verify", "wasm-bindings", "performance-smoke", "validation-scope", "environment-validation"]'
          allow-skipped: ${{ needs.validation-scope.outputs.allow-skipped || '[]' }}
