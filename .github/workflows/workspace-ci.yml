name: workspace-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Ownership and release validators
        run: |
          cargo metadata --locked --format-version 1 --no-deps
          python3 scripts/check_repository_boundaries.py --check
          python3 scripts/check_release_plan.py --check docs/repository-split/release-plan.json
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --locked --workspace --all-features
      - name: Test no default features
        run: cargo test --locked --workspace --no-default-features
      - name: Documentation
        run: cargo doc --locked --workspace --no-deps
      - name: Package all crates without publishing
        run: python3 scripts/check_release_plan.py --package-all docs/repository-split/release-plan.json

  performance-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Compile full benchmark matrix
        run: |
          mkdir -p .artifacts/performance-smoke
          cargo bench --locked --workspace --all-features --no-run 2>&1 \
            | tee .artifacts/performance-smoke/benchmark-compile.log
      - name: Install Callgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
      - name: Install Iai-Callgrind runner
        run: cargo install iai-callgrind-runner --version 0.16.1 --locked
      - name: Run deterministic performance smoke
        env:
          PERF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: bash scripts/benchmark-smoke.sh
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke-${{ github.sha }}
          path: .artifacts/performance-smoke/
          if-no-files-found: warn
