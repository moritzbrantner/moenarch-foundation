name: Validate timestamp repair

on:
  push:
    branches:
      - fix/lossless-timestamp-json
    paths:
      - .github/workflows/repair-timestamp-serde.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lossless-timestamp-json
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh lock and validate media-core
        run: |
          cargo metadata --format-version 1 >/dev/null
          cargo fmt --all
          cargo test -p moenarch-media-core --all-features
          cargo clippy -p moenarch-media-core --all-targets --all-features -- -D warnings
      - name: Commit generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/media/media-core/Cargo.toml crates/media/media-core/src/lib.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(media): refresh binary Serde validation state"
          git push origin HEAD:fix/lossless-timestamp-json
