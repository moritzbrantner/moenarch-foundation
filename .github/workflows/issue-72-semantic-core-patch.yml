name: Issue 72 semantic-core patch

on:
  push:
    branches:
      - feat/72-semantic-core-contract
    paths:
      - .github/workflows/issue-72-semantic-core-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/72-semantic-core-contract
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Align package inventory baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('scripts/repository_split.py'): [
                  (
                      '{"moenarch-corpus-core", "moenarch-math-geometry-3d", "moenarch-math-probability", "moenarch-priority-queue"}',
                      '{"moenarch-corpus-core", "moenarch-math-geometry-3d", "moenarch-math-probability", "moenarch-priority-queue", "moenarch-semantic-core"}',
                  ),
                  (
                      '4e7225483ac8d17388df5973b48ff2670c5726ed5f7a166a585c3ab4bdf6410d',
                      '51601607987f43fa74e889cb998193d36cfbc5fc5ebc856e65123d4c8febb598',
                  ),
              ],
              Path('scripts/check_repository_boundaries.py'): [
                  ('if len(records) != 64:', 'if len(records) != 65:'),
                  ('ownership must contain exactly 64 packages', 'ownership must contain exactly 65 packages'),
                  ('repository boundaries pass: 64 uniquely owned foundation packages', 'repository boundaries pass: 65 uniquely owned foundation packages'),
              ],
              Path('scripts/check_release_plan.py'): [
                  ('if len(packages) != 64 or set(names) != set(owned):', 'if len(packages) != 65 or set(names) != set(owned):'),
                  ('release plan must name all and only the 64 owned packages', 'release plan must name all and only the 65 owned packages'),
                  ('release plan passes: 64 packages retained at source versions; publication is not authorized', 'release plan passes: 65 packages retained at source versions; publication is not authorized'),
              ],
              Path('scripts/test_check_release_plan.py'): [
                  ('64 owned packages', '65 owned packages'),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Resolve semantic-core without dependency drift
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p moenarch-semantic-core
          git diff -- Cargo.lock
          python3 - <<'PY'
          import subprocess

          diff = subprocess.check_output(['git', 'diff', '--', 'Cargo.lock'], text=True)
          removed = [line for line in diff.splitlines() if line.startswith('-') and not line.startswith('---')]
          added = [line[1:] for line in diff.splitlines() if line.startswith('+') and not line.startswith('+++')]
          expected = {
              '[[package]]',
              'name = "moenarch-semantic-core"',
              'version = "0.1.0"',
              'dependencies = [',
              ' "serde",',
              ' "serde_json",',
              ' "sha2",',
              ']',
              '',
          }
          if removed:
              raise SystemExit(f'lockfile refresh removed existing lines: {removed}')
          unexpected = [line for line in added if line not in expected]
          if unexpected:
              raise SystemExit(f'unexpected Cargo.lock additions: {unexpected}; full additions={added}')
          if 'name = "moenarch-semantic-core"' not in added:
              raise SystemExit(f'lockfile did not register semantic-core: {added}')
          PY

      - name: Format
        run: cargo fmt --all

      - name: Focused semantic-core verification
        run: |
          cargo test --locked -p moenarch-semantic-core
          cargo clippy --locked -p moenarch-semantic-core --all-targets -- -D warnings
          cargo doc --locked -p moenarch-semantic-core --no-deps
          cargo package --locked -p moenarch-semantic-core --allow-dirty

      - name: Foundation ownership verification
        run: |
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          python3 scripts/check_repository_boundaries.py --check
          python3 scripts/check_release_plan.py --check docs/repository-split/release-plan.json
          python3 -m unittest discover -s scripts -p 'test_*.py'
          git diff --check

      - name: Commit generated and baseline changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock scripts/repository_split.py scripts/check_repository_boundaries.py scripts/check_release_plan.py scripts/test_check_release_plan.py crates/semantic/semantic-core/src/lib.rs
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Align semantic-core package verification baselines'
          git push origin HEAD:feat/72-semantic-core-contract
