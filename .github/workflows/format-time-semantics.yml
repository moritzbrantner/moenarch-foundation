name: Format time semantics branch

on:
  push:
    branches:
      - feat/centralize-time-semantics

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/centralize-time-semantics
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.rs'
          git commit -m 'style: apply rustfmt'
          git push origin HEAD:feat/centralize-time-semantics
