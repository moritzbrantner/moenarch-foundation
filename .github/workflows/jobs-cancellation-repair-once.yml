          replacements.append((r'''    #[test]
    fn runner_supports_cooperative_cancellation() {
        let runner = BackgroundJobRunner::default();
        let mut handle = runner
            .spawn(JobSpec::new("cancel-001", "Cancel").unwrap(), |context| {
                while !context.is_cancelled() {
                    std::thread::sleep(Duration::from_millis(1));
                }
                context.check_cancelled()
            })
            .unwrap();

        handle.request_cancel().unwrap();
        assert_eq!(handle.join(), Err(JobError::Cancelled));
        let snapshot = runner.tracker().snapshot(handle.id()).unwrap().unwrap();
        assert_eq!(snapshot.status, JobStatus::Cancelled);
    }
''', r'''    #[test]
    fn runner_supports_cooperative_cancellation() {
        let runner = BackgroundJobRunner::default();
        let entered_worker = Arc::new(Barrier::new(2));
        let release_worker = Arc::new(Barrier::new(2));
        let worker_entered = entered_worker.clone();
        let worker_release = release_worker.clone();
        let mut handle = runner
            .spawn(
                JobSpec::new("cancel-001", "Cancel").unwrap(),
                move |context| {
                    worker_entered.wait();
                    worker_release.wait();
                    context.check_cancelled()
                },
            )
            .unwrap();

        entered_worker.wait();
        handle.request_cancel().unwrap();
        assert_eq!(
            runner.tracker().snapshot(handle.id()).unwrap().unwrap().status,
            JobStatus::Cancelling
        );
        release_worker.wait();
        assert_eq!(handle.join(), Err(JobError::Cancelled));
        let snapshot = runner.tracker().snapshot(handle.id()).unwrap().unwrap();
        assert_eq!(snapshot.status, JobStatus::Cancelled);
    }
'''))

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact replacement, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          cargo fmt --all
          git diff --check

      - name: Verify focused jobs-core behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p moenarch-jobs-core cancelling_queued_job_is_terminal_before_start
          cargo test --locked -p moenarch-jobs-core runner_supports_cooperative_cancellation
          for _ in $(seq 1 50); do
            cargo test --locked -p moenarch-jobs-core runner_supports_cooperative_cancellation --quiet
          done
          cargo test --locked -p moenarch-jobs-core
          cargo clippy --locked -p moenarch-jobs-core --all-targets -- -D warnings

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/jobs/jobs-core/src/lib.rs
          git rm .github/workflows/jobs-cancellation-repair-once.yml
          git commit -m "Make job cancellation race-free"
          git push origin HEAD:fix/jobs-queued-cancellation
