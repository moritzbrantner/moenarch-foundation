name: Jobs cancellation repair once

on:
  push:
    branches: [fix/jobs-queued-cancellation]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jobs-queued-cancellation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Apply exact lifecycle repair
        run: |
          python3 scripts/apply_jobs_cancellation_repair.py
          cargo fmt --all
          git diff --check
      - name: Verify focused jobs-core behavior
        run: |
          set -euo pipefail
          cargo test --locked -p moenarch-jobs-core cancelling_queued_job_is_terminal_before_start
          cargo test --locked -p moenarch-jobs-core runner_supports_cooperative_cancellation
          for _ in $(seq 1 50); do
            cargo test --locked -p moenarch-jobs-core runner_supports_cooperative_cancellation --quiet
          done
          cargo test --locked -p moenarch-jobs-core
          cargo clippy --locked -p moenarch-jobs-core --all-targets -- -D warnings
      - name: Commit repair and remove one-shot files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/jobs/jobs-core/src/lib.rs
          git rm .github/workflows/jobs-cancellation-repair-once.yml scripts/apply_jobs_cancellation_repair.py
          git commit -m "Make job cancellation race-free"
          git push origin HEAD:fix/jobs-queued-cancellation
