name: Rebase graph convergence

on:
  push:
    branches:
      - rebase/graph-kernel-convergence
    paths:
      - .github/workflows/rebase-graph-convergence.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebase/graph-kernel-convergence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Replay reviewed graph files
        run: |
          git fetch origin feat/graph-kernel-convergence
          for path in \
            Cargo.toml \
            crates/algorithms/priority-queue/Cargo.toml \
            crates/data/graph-analysis-core/Cargo.toml \
            crates/data/graph-analysis-core/README.md \
            crates/data/graph-analysis-core/src/lib.rs \
            crates/data/graph-analysis-core/src/surface.rs
          do
            git show origin/feat/graph-kernel-convergence:"$path" > "$path"
          done
          cargo metadata --format-version 1 >/dev/null
          cargo fmt --all
      - name: Validate graph package
        run: |
          cargo test -p moenarch-graph-analysis-core --all-features
          cargo clippy -p moenarch-graph-analysis-core --all-targets --all-features -- -D warnings
      - name: Commit rebased slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebase-graph-convergence.yml
          git add Cargo.toml Cargo.lock crates/algorithms/priority-queue/Cargo.toml crates/data/graph-analysis-core
          git commit -m "feat(graph): replay convergence on current main"
          git push origin HEAD:rebase/graph-kernel-convergence
