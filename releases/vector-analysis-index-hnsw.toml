title = "Release moenarch-vector-analysis-core 0.2.1"
notes = "Pin-only patch release: carry the runtime-core 0.2.2 and numbers-core 0.2.1 pins so core resolves beside vector-analysis-index 0.2.1. No API change."

[[github_releases]]
tag = "moenarch-vector-analysis-index-v0.2.1"
