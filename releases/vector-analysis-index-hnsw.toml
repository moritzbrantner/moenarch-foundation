  "moenarch-vector-analysis-core-v0.2.1",
  "moenarch-vector-analysis-index-v0.2.1",
]
required_checks = [
  "cargo metadata --locked --format-version 1 --no-deps",
  "python3 scripts/check_repository_boundaries.py --check",
  "python3 scripts/check_release_plan.py --check docs/repository-split/release-plan.json",
  "python3 -m unittest discover -s scripts -p 'test_*.py'",
  "cargo fmt --all -- --check",
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "cargo test --locked --workspace --all-features",
  "cargo test --locked --workspace --no-default-features",
  "cargo doc --locked --workspace --no-deps",
  "python3 scripts/check_release_plan.py --package-all docs/repository-split/release-plan.json",
  "python3 scripts/check_numerical_package_tests.py",
]
required_consumer_checks = [
  "bash scripts/check_vector_index_hnsw_candidate_consumer.sh",
  "cargo package -p moenarch-vector-analysis-core --locked --list",
  "cargo package -p moenarch-vector-analysis-index --locked --list",
]

