[package]
name = "moenarch-vector-analysis-index"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Exact and deterministic approximate in-memory vector search."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "vector_analysis_index"

[dependencies]
hnsw_rs = { version = "0.3.5", optional = true }
media-core.workspace = true
runtime-core.workspace = true
search-kernels = "=0.1.0"
serde_json.workspace = true
serde.workspace = true
vector-analysis-core.workspace = true

[features]
default = []
# Optional external HNSW candidate selection (#119); native-only dependency graph.
hnsw = ["dep:hnsw_rs"]

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "search"
harness = false

[[example]]
name = "ann_three_way"
required-features = ["hnsw"]
