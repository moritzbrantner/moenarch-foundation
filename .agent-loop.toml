schema_version = 1
max_workers = 2

[verification]
# The draft Harness structural audit is a one-time bootstrap check against the
# independently reviewed base, not recurring authoritative Agent Loop evidence.
# Record its exact-base result on the bootstrap PR; do not add origin/main or a
# placeholder base here. The commands below remain the recurring handoff gate.
commands = [
  "cargo metadata --format-version 1 --no-deps",
  "python3 scripts/check_repository_boundaries.py --check",
  "python3 scripts/check_release_plan.py --check docs/repository-split/release-plan.json",
  "python3 -m unittest discover -s scripts -p 'test_*.py'",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cargo test --workspace --all-features",
  "cargo test --workspace --no-default-features",
  "cargo doc --workspace --no-deps",
  "python3 scripts/check_release_plan.py --package-all docs/repository-split/release-plan.json",
]

[publication]
command = "python3 scripts/publish_release.py"
authorization_label = "release:approved"
