schema_version = 1
max_workers = 2

[verification]
# Restructuring release slices deliberately retain only exact metadata,
# manifest, dependency-order, and selected-package archive safeguards. Clean
# exact-head, registry, issue-authorization, checksum, and immutable tag checks
# remain enforced by the publisher immediately around irreversible effects.
commands = [
  "cargo metadata --format-version 1 --no-deps",
  "python3 scripts/check_release_plan.py --check releases/foundation-wave-2.toml",
  "python3 scripts/check_release_plan.py --package-release releases/foundation-wave-2.toml",
]

[publication]
command = "python3 scripts/publish_release.py"
authorization_label = "release:approved"
